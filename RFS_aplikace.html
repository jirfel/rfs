<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protokol RFS - Terénní zadání</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 1em; background: #f4f4f4; }
    .container { background: white; padding: 1em; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
    label { display: block; margin-top: 1em; font-weight: bold; }
    input, select { width: 100%; padding: 0.5em; margin-top: 0.3em; border-radius: 5px; border: 1px solid #ccc; }
    button { margin-top: 1.5em; padding: 0.7em 1.5em; background: #007BFF; color: white; border: none; border-radius: 5px; font-size: 1em; cursor: pointer; }
    button:hover { background: #0056b3; }
    .button-group { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5em; }
    .section-title { margin-top: 2em; font-size: 1.2em; font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 0.3em; }
    .measurement-row { display: flex; gap: 1em; align-items: center; margin-top: 0.5em; }
    .measurement-row label { flex: 1; margin: 0; }
    .measurement-row input { flex: 2; }
    .warning { border: 2px solid red; background: #ffe6e6; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Protokol RFS - Formulář</h2>
    <!-- Sekce: Technické údaje -->
    <label>ID projektu</label>
    <input type="text" value="N.85001255.020" id="projectId">
    <label>Jméno technika</label>
    <input type="text" id="technician">
    <label>Město</label>
    <input type="text" id="city">
    <label>Ulice</label>
    <input type="text" id="street">
    <label>Číslo popisné</label>
    <input type="text" id="cp">
    <label>Číslo orientační</label>
    <input type="text" id="co">
    <label>Technologie</label>
    <select id="technology">
      <option>Delta LHD 43-1R</option>
      <option>Delta LHD 43-R</option>
      <option>Technetix DBC-1200 lite</option>
      <option>Teleste AC3210</option>
      <option>Teleste AC8810</option>
    </select>
    <button onclick="fetchLocationData()">Načíst část obce, GPS a RUIAN</button>
    <label>Část obce</label>
    <input type="text" id="suburb" readonly>
    <label>GPS</label>
    <input type="text" id="gps" readonly>
    <label>RUIAN kód</label>
    <input type="text" id="ruian" readonly>

    <!-- Sekce: Měření: -->
    <div class="section-title">Měření signálu (IN / OUT)</div>
    <div class="measurement-row">
      <label>264 MHz</label>
      <input type="number" id="in264" placeholder="IN 70-90" onblur="checkRange(this, 70, 90)">
      <input type="number" id="out264" placeholder="OUT 95-110" onblur="checkRange(this, 95, 110)">
    </div>
    <div class="measurement-row">
      <label>274 MHz</label>
      <input type="number" id="in274" placeholder="IN 70-90" onblur="checkRange(this, 70, 90)">
      <input type="number" id="out274" placeholder="OUT 95-110" onblur="checkRange(this, 95, 110)">
    </div>
    <div class="measurement-row">
      <label>855,25 MHz</label>
      <input type="number" id="in855" placeholder="IN 70-90" onblur="checkRange(this, 70, 90)">
      <input type="number" id="out855" placeholder="OUT 95-110" onblur="checkRange(this, 95, 110)">
    </div>
    <div class="measurement-row">
      <label>1186 MHz</label>
      <input type="number" id="in1186" placeholder="IN 70-90" onblur="checkRange(this, 70, 90)">
      <input type="number" id="out1186" placeholder="OUT 95-110" onblur="checkRange(this, 95, 110)">
    </div>
    <label>Napětí (V)</label>
    <select id="napeti">
      <script>for(let i=50;i<=65;i++)document.write(`<option>${i}</option>`);</script>
    </select>

    <!-- Sekce: Osazení -->
    <div class="section-title">Osazení modulů</div>
    <label>Cable simulator (PAD)</label>
    <select id="pad">
      <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option>
    </select>
    <div class="button-group">
      <button onclick="exportDataAsJSON()">💾 Exportovat JSON</button>
      <button onclick="alert(generateFileName())">📥 Stáhnout XLSX</button>
      <button>📄 Stáhnout PDF</button>
    </div>
  </div>
  <script>
    async function fetchLocationData() {
      const street = document.getElementById('street').value;
      const city = document.getElementById('city').value;
      const address = `${street}, ${city}, Česká republika`;
      const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&addressdetails=1`);
      const data = await response.json();
      if (data.length > 0) {
        const lat = data[0].lat;
        const lon = data[0].lon;
        document.getElementById('gps').value = `${lat}, ${lon}`;
        const suburb = data[0].address.suburb || data[0].address.city_district || '';
        document.getElementById('suburb').value = suburb;
        try {
          const ruianRes = await fetch(`https://vdp.cuzk.cz/vdp/ruian/budovy/get-by-point.json?x=${lon}&y=${lat}`);
          const ruianData = await ruianRes.json();
          if (ruianData.budovy && ruianData.budovy.length > 0) {
            document.getElementById('ruian').value = ruianData.budovy[0].kod;
          } else {
            document.getElementById('ruian').value = 'Nedostupné';
          }
        } catch (error) {
          document.getElementById('ruian').value = 'Chyba dotazu';
        }
      } else {
        alert('Adresa nenalezena. Zkontrolujte zadání.');
      }
    }
    function checkRange(input, min, max) {
      const value = parseFloat(input.value);
      if (!isNaN(value) && (value < min || value > max)) {
        input.classList.add("warning");
        input.title = "MIMO ROZSAH";
      } else {
        input.classList.remove("warning");
        input.title = "";
      }
    }
    function generateFileName() {
      const id = document.getElementById('projectId').value;
      const mesto = document.getElementById('city').value;
      const ulice = document.getElementById('street').value;
      const cp = document.getElementById('cp').value;
      const co = document.getElementById('co').value;
      return `${id}_${mesto}_${ulice}_${cp}_${co}_DOCSIS.xlsx`;
    }
    function exportDataAsJSON() {
      const data = {
        projectId: document.getElementById('projectId').value,
        technician: document.getElementById('technician').value,
        city: document.getElementById('city').value,
        street: document.getElementById('street').value,
        cp: document.getElementById('cp').value,
        co: document.getElementById('co').value,
        suburb: document.getElementById('suburb').value,
        gps: document.getElementById('gps').value,
        ruian: document.getElementById('ruian').value,
        in264: document.getElementById('in264').value,
        out264: document.getElementById('out264').value,
        in274: document.getElementById('in274').value,
        out274: document.getElementById('out274').value,
        in855: document.getElementById('in855').value,
        out855: document.getElementById('out855').value,
        in1186: document.getElementById('in1186').value,
        out1186: document.getElementById('out1186').value,
        napeti: document.getElementById('napeti').value,
        pad: document.getElementById('pad').value
      };
      const fileName = `${data.projectId}_${data.city}_${data.street}_${data.cp}_${data.co}_DOCSIS.json`;
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      link.click();
    }
  </script>
</body>
</html>
