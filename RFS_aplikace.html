<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RFS Protokol - Terénní aplikace</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 1em; }
    .container { background: white; padding: 2em; max-width: 800px; margin: auto; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    label { display: block; margin-top: 1em; font-weight: bold; }
    input, select { width: 100%; padding: 0.5em; margin-top: 0.3em; border-radius: 5px; border: 1px solid #ccc; }
    .section-title { margin-top: 2em; font-size: 1.2em; font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 0.5em; }
    .measurement-row { display: flex; gap: 1em; align-items: center; margin-top: 0.5em; }
    .measurement-row input { flex: 1; }
    .warning { border: 2px solid red; background-color: #ffe6e6; }
    button { margin-top: 2em; padding: 0.75em 1.5em; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
<div class="container">
  <h2>Terénní Protokol RFS</h2>
  <label>ID projektu</label>
  <input id="projectId" value="N.85001255.020">
  <label>Technik</label>
  <input id="technician">
  <label>Město</label>
  <input id="city">
  <label>Ulice</label>
  <input id="street">
  <label>Číslo popisné</label>
  <input id="cp">
  <label>Číslo orientační</label>
  <input id="co">
  <label>Technologie</label>
  <select id="technology">
    <option>Teleste AC3210</option>
    <option>Technetix DBC-1200 lite</option>
    <option>Delta LHD 43-R</option>
  </select>
  <label>Část obce</label>
  <input id="suburb" readonly>
  <label>GPS</label>
  <input id="gps" readonly>
  <label>RUIAN</label>
  <input id="ruian" readonly>
  <button onclick="fetchLocationData()">Načíst lokalitu</button>

  <div class="section-title">Měření signálu</div>
  <div class="measurement-row"><label>264 MHz</label><input id="in264" placeholder="IN"><input id="out264" placeholder="OUT"></div>
  <div class="measurement-row"><label>274 MHz</label><input id="in274"><input id="out274"></div>
  <div class="measurement-row"><label>855,25 MHz</label><input id="in855"><input id="out855"></div>
  <div class="measurement-row"><label>1186 MHz</label><input id="in1186"><input id="out1186"></div>
  <label>Napětí (V)</label>
  <select id="napeti">
    <script>for(let i=50;i<=65;i++)document.write(`<option>${i}</option>`);</script>
  </select>

  <div class="section-title">Osazení modulů</div>
  <label>PAD</label><select id="pad"><option>0</option><option>1</option><option>2</option><option>3</option></select>
  <label>Input Attenuator</label><select id="inputAtt"><option>0</option><option>5</option><option>10</option></select>
  <label>Input Equalizer</label><select id="inputEq"><option>0</option><option>6</option><option>9</option></select>
  <label>Interstage Attenuator</label><select id="interstageAtt"><option>0</option><option>8</option></select>
  <label>Slope</label><select id="slope"><option>0</option><option>1</option></select>
  <label>AGC</label><select id="agc"><option>0</option><option>1</option></select>
  <label>Return Attenuator</label><select id="returnAtt"><option>0</option><option>6</option></select>
  <label>Return Equalizer</label><select id="returnEq"><option>0</option><option>1</option></select>
  <label>Monitoring</label><select id="monitoring"><option>0</option><option>1</option></select>

  <button onclick="exportDataAsJSON()">💾 Exportovat JSON</button>
</div>
<script>
function exportDataAsJSON() {
  const data = {
    projectId: document.getElementById('projectId').value,
    technician: document.getElementById('technician').value,
    city: document.getElementById('city').value,
    street: document.getElementById('street').value,
    cp: document.getElementById('cp').value,
    co: document.getElementById('co').value,
    suburb: document.getElementById('suburb').value,
    gps: document.getElementById('gps').value,
    ruian: document.getElementById('ruian').value,
    in264: document.getElementById('in264').value,
    out264: document.getElementById('out264').value,
    in274: document.getElementById('in274').value,
    out274: document.getElementById('out274').value,
    in855: document.getElementById('in855').value,
    out855: document.getElementById('out855').value,
    in1186: document.getElementById('in1186').value,
    out1186: document.getElementById('out1186').value,
    napeti: document.getElementById('napeti').value,
    pad: document.getElementById('pad').value,
    inputAtt: document.getElementById('inputAtt').value,
    inputEq: document.getElementById('inputEq').value,
    interstageAtt: document.getElementById('interstageAtt').value,
    slope: document.getElementById('slope').value,
    agc: document.getElementById('agc').value,
    returnAtt: document.getElementById('returnAtt').value,
    returnEq: document.getElementById('returnEq').value,
    monitoring: document.getElementById('monitoring').value
  };
  const filename = `${data.projectId}_${data.city}_${data.street}_${data.cp}_${data.co}_DOCSIS.json`;
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
</script>
</body>
</html>
